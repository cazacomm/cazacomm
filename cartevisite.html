<script>
  /* Bouton de partage natif : affiché seulement si le navigateur sait partager
     (mobile surtout). Sur ordinateur, il copie le lien à la place. */
  (function () {
    var btn = document.getElementById('cardShare');
    var label = btn.querySelector('span');
    var url = 'https://www.cazacomm.fr/cartevisite';
    if (!navigator.share && !(navigator.clipboard && window.isSecureContext)) return;
    if (!navigator.share) label.textContent = 'Copier le lien';
    btn.hidden = false;
    btn.addEventListener('click', function () {
      if (navigator.share) {
        navigator.share({ title: 'Jérémy Pogut | Caza Comm', url: url }).catch(function () {});
      } else {
        navigator.clipboard.writeText(url).then(function () {
          label.textContent = 'Lien copié';
          setTimeout(function () { label.textContent = 'Copier le lien'; }, 2000);
        });
      }
    });
  })();
</script>
