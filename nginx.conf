server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    absolute_redirect off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Routage facon GitHub Pages : /devis, /devis.html, /blog/... fonctionnent tous.
    # Pas de cache ici : ce bloc sert le HTML, qui doit rester frais.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache long sur les assets versionnes
    location ~* \.(css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fichiers de racine servis tels quels, sans cache long
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /rss.xml {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /site.webmanifest {
        # Absent de la table mime.types de nginx, on le declare ici
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Pas de 404.html dans le repo pour l'instant : nginx renvoie sa page 404 par defaut.
    # Des qu'un 404.html existe a la racine, decommenter les deux lignes ci-dessous.
    # error_page 404 /404.html;
    # location = /404.html { internal; }
}
